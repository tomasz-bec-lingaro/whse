services:
  api:
    build:
      context: .
    container_name: hse-delivery-api
    environment:
      APP_ENV: ${APP_ENV:-local}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://hse:hse@postgres:5432/hse_delivery}
      AZURE_STORAGE_CONNECTION_STRING: ${AZURE_STORAGE_CONNECTION_STRING:-DefaultEndpointsProtocol=http;AccountName=devstoreaccount1;AccountKey=Eby8vdM02xNOcqFeqCnf2weFJvLx9ywW8l7Lp4tbc2jVR1bpN4uWwv3N5q8Q6H7SFWpX83txr/65nK7c2Tqg==;BlobEndpoint=http://azurite:10000/devstoreaccount1;}
      AZURE_STORAGE_CONTAINER_NAME: ${AZURE_STORAGE_CONTAINER_NAME:-delivery-documents}
      MAX_UPLOAD_SIZE_MB: ${MAX_UPLOAD_SIZE_MB:-10}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      azurite:
        condition: service_started

  postgres:
    image: postgres:16-alpine
    container_name: hse-delivery-postgres
    environment:
      POSTGRES_USER: hse
      POSTGRES_PASSWORD: hse
      POSTGRES_DB: hse_delivery
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hse -d hse_delivery"]
      interval: 5s
      timeout: 5s
      retries: 10

  azurite:
    image: mcr.microsoft.com/azure-storage/azurite:3.33.0
    container_name: hse-delivery-azurite
    command: azurite-blob --blobHost 0.0.0.0 --blobPort 10000
    ports:
      - "10000:10000"
    volumes:
      - azurite_data:/data

volumes:
  postgres_data:
  azurite_data:

